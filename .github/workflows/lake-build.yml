name: Lake Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.ref || github.ref }}

      - name: Install Lean toolchain and Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true

      - name: Lake build
        run: lake build Proofs
