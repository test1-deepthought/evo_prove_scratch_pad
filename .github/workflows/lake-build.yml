name: Lake Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.ref || github.ref }}

      - name: Install elan (with retry)
        run: |
          for i in 1 2 3 4 5; do
            echo "Attempt $i..."
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y && break
            echo "Failed, retrying in 10s..."
            sleep 10
          done
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Cache mathlib
        uses: actions/cache@v4
        with:
          path: .lake
          key: mathlib-${{ hashFiles('lake-manifest.json') }}
          restore-keys: mathlib-

      - name: Lake update
        run: lake update || lake update || lake update

      - name: Lake exe cache get
        run: lake exe cache get || true

      - name: Lake build
        run: lake build
