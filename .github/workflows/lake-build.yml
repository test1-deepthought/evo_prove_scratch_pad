name: Lake Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.ref || github.ref }}

      - name: Free disk space for Mathlib cache
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Install Lean toolchain and Mathlib cache
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          use-mathlib-cache: true

      - name: Show proof files
        run: |
          echo "Proof import index:"
          cat Proofs.lean
          echo
          echo "Proof files:"
          find Proofs -maxdepth 2 -type f -name '*.lean' -print | sort
          {
            echo "## Proof files compiled"
            echo
            echo "### Proof import index"
            echo '```lean'
            cat Proofs.lean
            echo '```'
            echo
            echo "### Proof files"
            echo '```text'
            find Proofs -maxdepth 2 -type f -name '*.lean' -print | sort
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Lake build
        run: lake build Proofs
