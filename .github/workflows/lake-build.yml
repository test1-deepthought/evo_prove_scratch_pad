name: Lake Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: leanprover/lean4:latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.ref || github.ref }}

      - name: Cache mathlib
        uses: actions/cache@v4
        with:
          path: .lake
          key: mathlib-${{ hashFiles('lake-manifest.json') }}

      - name: Lake build
        run: |
          lake exe cache get || true
          lake build
